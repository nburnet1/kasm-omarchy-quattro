# Disposable loopback fixture: mimics Kasm's prefix stripping and session auth.
# The fixed password is only for the labeled test container on localhost:16913.
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events {}
http {
    access_log off;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    server {
        listen 127.0.0.1:16915 ssl;
        ssl_certificate /fixtures.pem;
        ssl_certificate_key /fixtures.pem;
        location /desktop/selkies-browser-test/vnc/ {
            # Reproduce the live Kasm session validator, missing in the first fixture.
            if ($uri ~ "/api/") { return 403; }
            proxy_pass https://127.0.0.1:16913/;
            proxy_ssl_verify off;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Authorization "Basic a2FzbV91c2VyOnNlbGtpZXMta2FzbS1pbnRlZ3JhdGlvbi10ZXN0";
            proxy_buffering off;
            proxy_read_timeout 300s;
        }
        location / { return 404; }
    }
}
