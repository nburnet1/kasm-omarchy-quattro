desktop:
  resolution:
    width: 1280
    height: 720
keyboard:
  remap_keys:
    # Translate the Mac's remote-only F18 key before the inner VNC bridge.
    - 0xffcf->0xffeb
network:
  ssl:
    pem_certificate: ${HOME}/.vnc/self.pem
    pem_key: ${HOME}/.vnc/self.pem
  udp:
    public_ip: 127.0.0.1
runtime_configuration:
  allow_override_standard_vnc_server_settings: true
  allow_override_list:
    - pointer.enabled
